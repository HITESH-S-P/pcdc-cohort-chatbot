<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCDC Cohort Discovery Chatbot | GSoC 2026</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg-glass: rgba(255, 255, 255, 0.9);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border: #e2e8f0;
        --radius-lg: 1rem;
        --shadow-xl:
          0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top right, #1e293b, #0f172a);
        min-height: 100vh;
        color: var(--text-primary);
        overflow: hidden;
      }

      /* Subtle background animation */
      .bg-glow {
        position: fixed;
        width: 40vw;
        height: 40vw;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.15) 0%,
          transparent 70%
        );
        border-radius: 50%;
        z-index: 0;
        filter: blur(50px);
        animation: float 20s infinite alternate;
      }

      @keyframes float {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(20%, 20%);
        }
      }

      .app-container {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
      }

      .header {
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
      }

      .logo-text {
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(to right, var(--primary), #a855f7);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .main-layout {
        flex: 1;
        display: flex;
        gap: 1.5rem;
        overflow: hidden;
      }

      .sidebar {
        width: 300px;
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
        transition: transform 0.3s ease;
      }

      .chat-area {
        flex: 1;
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
        position: relative;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .message {
        max-width: 80%;
        padding: 1rem 1.5rem;
        border-radius: 1.25rem;
        animation: fadeIn 0.4s ease-out;
        line-height: 1.5;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.bot {
        align-self: flex-start;
        background: white;
        border-bottom-left-radius: 0.2rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .message.user {
        align-self: flex-end;
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 0.2rem;
      }

      .input-wrapper {
        padding: 1.5rem;
        background: white;
        border-top: 1px solid var(--border);
        border-bottom-left-radius: var(--radius-lg);
        border-bottom-right-radius: var(--radius-lg);
        display: flex;
        gap: 0.75rem;
      }

      .chat-input {
        flex: 1;
        padding: 0.875rem 1.25rem;
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        outline: none;
        transition: all 0.2s;
        font-family: inherit;
      }

      .chat-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0 1.5rem;
        border-radius: 0.75rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }

      .send-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .quick-btn {
        width: calc(100% - 2rem);
        margin: 0.5rem 1rem;
        padding: 0.75rem 1rem;
        background: white;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.875rem;
      }

      .quick-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateX(4px);
        background: #f8fafc;
      }

      /* Professional Code Card */
      .graphql-card {
        margin: 1rem 0;
        background: #1e293b;
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .graphql-header {
        background: #0f172a;
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #94a3b8;
        font-size: 0.75rem;
      }
      .graphql-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .graphql-action {
        cursor: pointer;
        color: #cbd5e1;
        user-select: none;
      }
      .graphql-action:hover {
        color: white;
      }
      .graphql-code {
        padding: 1.25rem;
        color: #e2e8f0;
        font-family: "Consolas", monospace;
        font-size: 0.875rem;
        overflow-x: auto;
      }
      .json-card {
        margin: 1rem 0;
        background: #0b1220;
        border-radius: 0.75rem;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .json-header {
        background: #07101f;
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #94a3b8;
        font-size: 0.75rem;
      }
      .json-code {
        padding: 1.25rem;
        color: #e2e8f0;
        font-family: "Consolas", monospace;
        font-size: 0.875rem;
        overflow-x: auto;
        white-space: pre;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
        background: #f1f5f9;
        border-radius: 2rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="app-container">
      <header class="header">
        <div>
          <h2 class="logo-text">PCDC Discovery</h2>
          <span style="font-size: 0.7rem; color: var(--text-secondary)"
            >GSoC 2026 OFFICIAL DEMO</span
          >
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span id="status">Systems Online</span>
        </div>
      </header>

      <div class="main-layout">
        <aside class="sidebar">
          <div style="padding: 1.5rem">
            <h4 style="margin-bottom: 0.5rem">AI Controls</h4>
            <p style="font-size: 0.8rem; color: var(--text-secondary)">
              Natural language to GraphQL engine.
            </p>
          </div>
          <button class="quick-btn" onclick="quickQuery('general')">
            ✨ What is PCDC?
          </button>
          <button class="quick-btn" onclick="quickQuery('docs')">
            📖 Schema Docs
          </button>
          <button class="quick-btn" onclick="quickQuery('graphql')">
            🚀 Generate Query
          </button>
          <button class="quick-btn" onclick="quickQuery('explain')">
            🔍 Explain Query
          </button>

          <div
            style="
              margin-top: auto;
              padding: 1.5rem;
              font-size: 0.7rem;
              border-top: 1px solid var(--border);
            "
          >
            Pediatric Cancer Data Commons<br />
            <span style="opacity: 0.6">v1.2.0-stable</span>
          </div>
        </aside>

        <main class="chat-area">
          <div class="messages-container" id="chatMessages">
            <div class="message bot">
              <h3 style="color: var(--primary); margin-bottom: 0.5rem">
                Welcome, Researcher
              </h3>
              <p>
                I am your specialized interface for the Pediatric Cancer Data
                Commons. Describe a cohort, and I will draft the GraphQL query.
              </p>
            </div>
          </div>

          <div class="input-wrapper">
            <input
              type="text"
              class="chat-input"
              id="chatInput"
              placeholder="Enter natural language request..."
              autocomplete="off"
            />
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">
              Draft Query
            </button>
          </div>
        </main>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const status = document.getElementById("status");
      const sendBtn = document.getElementById("sendBtn");

      // Transport:
      // - Default: HTTP POST /api/chat (serverless-friendly)
      // - Fallback: Socket.IO if HTTP fails
      const urlParams = new URLSearchParams(window.location.search);
      const preferSocket = urlParams.get("transport") === "socket";
      let socket = null;
      let transportMode = preferSocket ? "socket" : "http";

      function ensureSocket() {
        if (socket) return socket;
        socket = io();
        socket.on("bot-response", (data) => {
          addMessage("bot", data.response);
          status.textContent = "Systems Online";
          sendBtn.disabled = false;
        });
        return socket;
      }

      function addMessage(sender, content) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;

        // Handle GraphQL formatting
        let formatted = content;
        if (content.includes("```graphql")) {
          formatted = content.replace(
            /```graphql\s*([\s\S]*?)\s*```/gi,
            (_, query) => {
              return `<div class="graphql-card">
                    <div class="graphql-header">
                      <span>QUERY</span>
                      <span class="graphql-actions">
                        <span class="graphql-action" onclick="runDummyTest(this)">Test</span>
                        <span class="graphql-action" onclick="copyText(this)">Copy</span>
                      </span>
                    </div>
                    <pre class="graphql-code">${escapeHtml(query.trim())}</pre>
                </div>`;
            },
          );
        }

        msgDiv.innerHTML = formatted.replace(/\n/g, "<br>");
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        addMessage("user", msg);
        chatInput.value = "";
        status.textContent = "Processing...";
        sendBtn.disabled = true;

        if (transportMode === "socket") {
          ensureSocket().emit("user-message", msg);
          return;
        }

        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });

          const data = await resp.json().catch(() => null);
          if (!resp.ok) {
            const errText =
              (data && (data.error || data.message)) ||
              `Request failed (${resp.status})`;
            throw new Error(errText);
          }

          addMessage("bot", data.response);
          status.textContent = "Systems Online";
          sendBtn.disabled = false;
        } catch (e) {
          // Fallback to socket if available.
          transportMode = "socket";
          status.textContent = "Switching to Socket.IO...";
          addMessage(
            "bot",
            `⚠️ HTTP chat failed (${String(e.message || e)}). Falling back to Socket.IO.`,
          );
          ensureSocket().emit("user-message", msg);
        }
      }

      function quickQuery(type) {
        const queries = {
          general: "Tell me about PCDC cohort discovery",
          docs: "Show me PCDC GraphQL schema documentation",
          graphql: "Generate GraphQL query for breast cancer patients age 50+",
          explain:
            'Explain this GraphQL query: { cohort(filterSet: { diagnosis: [{ term: { name: "breast carcinoma" } }] }) { totalCounts { subjects } } }',
        };
        chatInput.value = queries[type];
        sendMessage();
      }

      function copyText(el) {
        const card = el.closest(".graphql-card");
        const code = card.querySelector(".graphql-code").innerText;
        navigator.clipboard.writeText(code);
        el.innerText = "Copied!";
        setTimeout(() => (el.innerText = "Copy"), 2000);
      }

      async function runDummyTest(el) {
        const card = el.closest(".graphql-card");
        const code = card.querySelector(".graphql-code").innerText;

        status.textContent = "Testing on dummy data...";
        sendBtn.disabled = true;
        el.innerText = "Testing...";

        try {
          const resp = await fetch("/api/test-query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: code }),
          });

          const data = await resp.json().catch(() => null);
          if (!resp.ok) {
            const msg =
              (data && (data.error || (data.errors && data.errors[0]?.message))) ||
              `Test failed (${resp.status})`;
            throw new Error(msg);
          }

          const pretty = JSON.stringify(data, null, 2);
          addMessage(
            "bot",
            `<div class="json-card">
              <div class="json-header">
                <span>DUMMY DATA RESULT</span>
                <span class="graphql-actions">
                  <span class="graphql-action" onclick="copyJson(this)">Copy</span>
                </span>
              </div>
              <pre class="json-code">${escapeHtml(pretty)}</pre>
            </div>`,
          );

          status.textContent = "Systems Online";
        } catch (e) {
          addMessage(
            "bot",
            `❌ Dummy test failed: ${String(e.message || e)}\n\nTip: your generated query must request fields that exist in the demo schema (e.g. \`cohort { count totalCount cases { caseId } }\`).`,
          );
          status.textContent = "Systems Online";
        } finally {
          sendBtn.disabled = false;
          el.innerText = "Test";
        }
      }

      function copyJson(el) {
        const header = el.closest(".json-header");
        const code = header.nextElementSibling.innerText;
        navigator.clipboard.writeText(code);
        el.innerText = "Copied!";
        setTimeout(() => (el.innerText = "Copy"), 2000);
      }

      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
