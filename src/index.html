<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCDC Cohort Discovery Chatbot | GSoC 2026</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --bg-glass: rgba(255, 255, 255, 0.9);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border: #e2e8f0;
        --radius-lg: 1rem;
        --shadow-xl:
          0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top right, #1e293b, #0f172a);
        min-height: 100vh;
        color: var(--text-primary);
        overflow: hidden;
      }

      /* Subtle background animation */
      .bg-glow {
        position: fixed;
        width: 40vw;
        height: 40vw;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.15) 0%,
          transparent 70%
        );
        border-radius: 50%;
        z-index: 0;
        filter: blur(50px);
        animation: float 20s infinite alternate;
      }

      @keyframes float {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(20%, 20%);
        }
      }

      .app-container {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
      }

      .header {
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
      }

      .logo-text {
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(to right, var(--primary), #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .main-layout {
        flex: 1;
        display: flex;
        gap: 1.5rem;
        overflow: hidden;
      }

      .sidebar {
        width: 300px;
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
        transition: transform 0.3s ease;
      }

      .chat-area {
        flex: 1;
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: var(--shadow-xl);
        position: relative;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .message {
        max-width: 80%;
        padding: 1rem 1.5rem;
        border-radius: 1.25rem;
        animation: fadeIn 0.4s ease-out;
        line-height: 1.5;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.bot {
        align-self: flex-start;
        background: white;
        border-bottom-left-radius: 0.2rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .message.user {
        align-self: flex-end;
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 0.2rem;
      }

      .input-wrapper {
        padding: 1.5rem;
        background: white;
        border-top: 1px solid var(--border);
        border-bottom-left-radius: var(--radius-lg);
        border-bottom-right-radius: var(--radius-lg);
        display: flex;
        gap: 0.75rem;
      }

      .chat-input {
        flex: 1;
        padding: 0.875rem 1.25rem;
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        outline: none;
        transition: all 0.2s;
        font-family: inherit;
      }

      .chat-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0 1.5rem;
        border-radius: 0.75rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }

      .send-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .quick-btn {
        width: calc(100% - 2rem);
        margin: 0.5rem 1rem;
        padding: 0.75rem 1rem;
        background: white;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.875rem;
      }

      .quick-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateX(4px);
        background: #f8fafc;
      }

      /* Professional Code Card */
      .graphql-card {
        margin: 1rem 0;
        background: #1e293b;
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .graphql-header {
        background: #0f172a;
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #94a3b8;
        font-size: 0.75rem;
      }
      .graphql-code {
        padding: 1.25rem;
        color: #e2e8f0;
        font-family: "Consolas", monospace;
        font-size: 0.875rem;
        overflow-x: auto;
      }

      .status-badge {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
        background: #f1f5f9;
        border-radius: 2rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="app-container">
      <header class="header">
        <div>
          <h2 class="logo-text">PCDC Discovery</h2>
          <span style="font-size: 0.7rem; color: var(--text-secondary)"
            >GSoC 2026 OFFICIAL DEMO</span
          >
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span id="status">Systems Online</span>
        </div>
      </header>

      <div class="main-layout">
        <aside class="sidebar">
          <div style="padding: 1.5rem">
            <h4 style="margin-bottom: 0.5rem">AI Controls</h4>
            <p style="font-size: 0.8rem; color: var(--text-secondary)">
              Natural language to GraphQL engine.
            </p>
          </div>
          <button class="quick-btn" onclick="quickQuery('general')">
            ✨ What is PCDC?
          </button>
          <button class="quick-btn" onclick="quickQuery('docs')">
            📖 Schema Docs
          </button>
          <button class="quick-btn" onclick="quickQuery('graphql')">
            🚀 Generate Query
          </button>

          <div
            style="
              margin-top: auto;
              padding: 1.5rem;
              font-size: 0.7rem;
              border-top: 1px solid var(--border);
            "
          >
            Pediatric Cancer Data Commons<br />
            <span style="opacity: 0.6">v1.2.0-stable</span>
          </div>
        </aside>

        <main class="chat-area">
          <div class="messages-container" id="chatMessages">
            <div class="message bot">
              <h3 style="color: var(--primary); margin-bottom: 0.5rem">
                Welcome, Researcher
              </h3>
              <p>
                I am your specialized interface for the Pediatric Cancer Data
                Commons. Describe a cohort, and I will draft the GraphQL query.
              </p>
            </div>
          </div>

          <div class="input-wrapper">
            <input
              type="text"
              class="chat-input"
              id="chatInput"
              placeholder="Enter natural language request..."
              autocomplete="off"
            />
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">
              Draft Query
            </button>
          </div>
        </main>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const status = document.getElementById("status");

      function addMessage(sender, content) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;

        // Handle GraphQL formatting
        let formatted = content;
        if (content.includes("```graphql")) {
          formatted = content.replace(
            /```graphql\s*([\s\S]*?)\s*```/gi,
            (_, query) => {
              return `<div class="graphql-card">
                    <div class="graphql-header"><span>QUERY</span><span style="cursor:pointer" onclick="copyText(this)">Copy</span></div>
                    <pre class="graphql-code">${query.trim()}</pre>
                </div>`;
            },
          );
        }

        msgDiv.innerHTML = formatted.replace(/\n/g, "<br>");
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        addMessage("user", msg);
        chatInput.value = "";
        socket.emit("user-message", msg);
        status.textContent = "Processing...";
      }

      socket.on("bot-response", (data) => {
        addMessage("bot", data.response);
        status.textContent = "Systems Online";
      });

      function quickQuery(type) {
        const queries = {
          general: "Tell me about PCDC cohort discovery",
          docs: "Show me PCDC GraphQL schema documentation",
          graphql: "Generate GraphQL query for breast cancer patients age 50+",
        };
        chatInput.value = queries[type];
        sendMessage();
      }

      function copyText(el) {
        const code = el.parentElement.nextElementSibling.innerText;
        navigator.clipboard.writeText(code);
        el.innerText = "Copied!";
        setTimeout(() => (el.innerText = "Copy"), 2000);
      }

      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
